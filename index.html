<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Prix da Maria</title>
<style>
  :root {
    --bg: #0b0b0f;
    --panel: #15151c;
    --line: #26262f;
    --text: #f3f3f6;
    --muted: #9a9aa8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; justify-content: center; padding: 28px 16px calc(28px + env(safe-area-inset-bottom)); }
  main { width: 100%; max-width: 440px; }
  h1 { font-size: 1.55rem; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.sub { color: var(--muted); margin: 0 0 22px; font-size: 0.98rem; }
  .screen { display: none; animation: fade .35s ease; }
  .screen.on { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* escolha */
  .teams { display: grid; gap: 10px; }
  .team { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--c);
    color: var(--text); font: inherit; font-size: 1.05rem; font-weight: 600;
    padding: 12px 16px; border-radius: 12px; cursor: pointer; transition: transform .12s, border-color .12s; }
  .team:active { transform: scale(.98); }
  .team:hover { border-color: var(--c); }
  .team svg { width: 90px; height: 30px; flex: none; }

  /* largada */
  .lights { display: flex; justify-content: center; gap: 10px; margin: 6px 0 26px; }
  .light { width: 46px; height: 46px; border-radius: 50%; background: #2a0d0d; border: 3px solid #000;
    box-shadow: inset 0 0 8px #000; transition: background .08s, box-shadow .08s; }
  .light.on { background: #ff1f1f; box-shadow: 0 0 18px #ff1f1f, inset 0 0 6px #ffb0b0; }
  .status { text-align: center; color: var(--muted); font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; font-size: .85rem; margin-bottom: 18px; min-height: 1.2em; }

  .track { display: grid; gap: 8px; }
  .lane { position: relative; height: 44px; background: var(--panel); border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); }
  .lane::before { content: ""; position: absolute; left: 0; right: 0; bottom: 5px; height: 2px;
    background: repeating-linear-gradient(90deg, #2c2c36 0 14px, transparent 14px 28px); }
  .lane::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 10px;
    background: repeating-conic-gradient(#fff 0% 25%, #000 0% 50%) 0 0 / 10px 10px; opacity: .85; }
  .lane .car { position: absolute; left: 0; top: 4px; width: 90px; height: 30px; transform: translateX(0); }
  .lane .car svg { width: 100%; height: 100%; display: block; }
  .lane.mine { outline: 2px solid var(--c); }

  /* rodas girando na corrida */
  .car.racing .spin { animation: spin .28s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* resultado */
  .result { text-align: center; }
  .big { font-size: 2rem; line-height: 1.15; margin: 4px 0 10px; font-weight: 800; }
  .win .big { color: #fff; }
  .msg { color: var(--muted); font-size: 1.05rem; margin: 0 0 22px; }
  .grid { list-style: none; margin: 0 0 22px; padding: 0; text-align: left; display: grid; gap: 6px; }
  .grid li { display: flex; align-items: center; gap: 12px; background: var(--panel);
    border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 10px; padding: 10px 14px; }
  .grid li .pos { font-weight: 800; width: 1.6rem; }
  .grid li.mine { background: #1d1d27; border-color: var(--c); }
  .grid li .you { margin-left: auto; font-size: .78rem; color: var(--muted); }
  button.again { background: #fff; color: #000; border: 0; font: inherit; font-weight: 700;
    padding: 13px 22px; border-radius: 999px; cursor: pointer; }
  button.again:active { transform: scale(.97); }
  /* abertura */
  .welcome { text-align: center; padding-top: 12vh; }
  .welcome .flag { width: 120px; height: 36px; margin: 0 auto 22px; border-radius: 6px;
    background: repeating-conic-gradient(#fff 0% 25%, #000 0% 50%) 0 0 / 12px 12px; }
  .welcome h1 { font-size: 2rem; margin-bottom: 28px; }
  a.wpp { display: block; margin-top: 16px; color: var(--muted); font-size: .95rem; }

  /* pedido do número */
  .ask { margin: 0 0 22px; }
  .ask .q { font-size: 1.2rem; font-weight: 700; margin: 0 0 14px; }
  .ask form { display: grid; gap: 10px; }
  .ask input { width: 100%; font: inherit; font-size: 1.15rem; padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); text-align: center; }
  .ask input:focus { outline: 2px solid #fff; }
  .ask button.again { width: 100%; }
  button.ghost { background: transparent; color: var(--muted); border: 0; font: inherit; padding: 8px; cursor: pointer; }
  .ask .note { color: #ffb4b4; font-size: 1rem; font-weight: 600; min-height: 1.2em; }
  .ask .note a { color: #fff; }
  [hidden] { display: none !important; }
  #confetti { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<main>
  <section id="welcome" class="screen on">
    <div class="welcome">
      <div class="flag"></div>
      <h1>Bem-vinda, Maria</h1>
      <button class="again" id="start">Começar</button>
    </div>
  </section>

  <section id="pick" class="screen">
    <h1>Grand Prix da Maria 🏁</h1>
    <p class="sub">Acerta qual carro vai vencer e ganha um prêmio. Escolhe com cuidado.</p>
    <div class="teams" id="teams"></div>
  </section>

  <section id="race" class="screen">
    <div class="lights" id="lights"></div>
    <div class="status" id="status">Preparar...</div>
    <div class="track" id="track"></div>
  </section>

  <section id="result" class="screen result">
    <div id="resultTop"></div>
    <ul class="grid" id="grid"></ul>
    <div class="ask" id="ask" hidden></div>
    <button class="again" id="again">Tentar de novo</button>
    <a class="wpp" id="wpp" hidden target="_blank" rel="noopener">Prefiro chamar o Luan</a>
  </section>
</main>
<canvas id="confetti"></canvas>

<script>
// color = cor de identificação (bordas); body/accent/trim = pintura do carro
const TEAMS = [
  { id: "redbull",  name: "Red Bull", color: "#3671c6", body: "#1b2f6b", accent: "#e8002d", trim: "#ffd21f" },
  { id: "ferrari",  name: "Ferrari",  color: "#e8002d", body: "#e8002d", accent: "#ffec00", trim: "#ffffff" },
  { id: "audi",     name: "Audi",     color: "#c9ccd1", body: "#d7d9de", accent: "#f50537", trim: "#111114" },
  { id: "mclaren",  name: "McLaren",  color: "#ff8000", body: "#ff8000", accent: "#47c7fc", trim: "#111114" },
  { id: "mercedes", name: "Mercedes", color: "#27f4d2", body: "#2c3038", accent: "#27f4d2", trim: "#c9ccd1" }
];

// carro de F1 visto de lado, virado para a direita
function carSVG(t) {
  const { body, accent, trim } = t;
  const wheel = (cx, cy, r, rim) => `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#101014"/>
    <circle cx="${cx}" cy="${cy}" r="${r - 0.9}" fill="none" stroke="${accent}" stroke-width="0.8" opacity=".9"/>
    <circle cx="${cx}" cy="${cy}" r="${rim}" fill="#2b2b33"/>
    <g class="spin">
      <line x1="${cx - rim + 0.8}" y1="${cy}" x2="${cx + rim - 0.8}" y2="${cy}" stroke="#9a9aa8" stroke-width="1.1"/>
      <line x1="${cx}" y1="${cy - rim + 0.8}" x2="${cx}" y2="${cy + rim - 0.8}" stroke="#9a9aa8" stroke-width="1.1"/>
      <line x1="${cx - rim * 0.7}" y1="${cy - rim * 0.7}" x2="${cx + rim * 0.7}" y2="${cy + rim * 0.7}" stroke="#9a9aa8" stroke-width="1.1"/>
      <line x1="${cx - rim * 0.7}" y1="${cy + rim * 0.7}" x2="${cx + rim * 0.7}" y2="${cy - rim * 0.7}" stroke="#9a9aa8" stroke-width="1.1"/>
    </g>
    <circle cx="${cx}" cy="${cy}" r="1.4" fill="${trim}"/>`;

  return `
<svg viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- asa traseira -->
  <rect x="12" y="13" width="2" height="10" fill="#15151a"/>
  <rect x="7" y="5.5" width="3" height="19" rx="1" fill="#15151a"/>
  <rect x="5" y="5.5" width="17" height="3.2" rx="1" fill="${accent}"/>
  <rect x="7" y="10.5" width="14" height="2" rx="1" fill="#15151a"/>

  <!-- assoalho -->
  <rect x="18" y="30" width="78" height="1.8" rx="0.9" fill="#15151a"/>

  <!-- corpo -->
  <path d="M13 30 L13 22.5 L22 19.5 L36 18 L41 11.5 L50 11.5 L52.5 16.5 L60 18.5 L82 22 L100 25.5 L109 27.4 L109 29.2 L100 29.8 L88 30.4 L20 30.4 Z" fill="${body}"/>
  <!-- entrada de ar -->
  <path d="M36.5 18 L41 11.5 L50 11.5 L52.5 16.5 Z" fill="#000" opacity=".28"/>
  <!-- faixa lateral -->
  <path d="M44 22 L82 24.2 L82 26.6 L44 26.6 Z" fill="${accent}"/>
  <!-- brilho -->
  <path d="M24 20.5 L40 19 L60 19.8 L82 22.5 L100 26" stroke="#fff" stroke-opacity=".35" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- cockpit, capacete e halo -->
  <path d="M53.5 17.2 L62 17.8 L67 20 L53.5 20 Z" fill="#0c0c10"/>
  <circle cx="58" cy="15.2" r="3.1" fill="${trim}"/>
  <rect x="58.6" y="14.4" width="3.2" height="1.7" rx="0.8" fill="#9ad8ff"/>
  <path d="M52.5 17.5 L58 10 L68 18.8" stroke="#1a1a20" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- asa dianteira -->
  <rect x="102" y="31.6" width="16" height="2.2" rx="1" fill="#15151a"/>
  <rect x="104.5" y="29.2" width="11" height="1.6" rx="0.8" fill="${accent}"/>
  <rect x="115" y="27.6" width="2.2" height="6.6" rx="1" fill="${accent}"/>

  <!-- rodas -->
  ${wheel(26, 28.5, 8.6, 5)}
  ${wheel(88, 29.2, 7, 4)}
</svg>`;
}

const $ = (id) => document.getElementById(id);
const show = (id) => {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
  window.scrollTo({ top: 0 });
};
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// tela de escolha
const teamsEl = $("teams");
TEAMS.forEach(t => {
  const b = document.createElement("button");
  b.className = "team";
  b.style.setProperty("--c", t.color);
  b.innerHTML = carSVG(t) + `<span>${t.name}</span>`;
  b.onclick = () => startRace(t);
  teamsEl.appendChild(b);
});

// ---- CONFIGURAÇÃO (preencha antes de publicar) ----
const CONFIG = {
  // Seu WhatsApp com país e DDD, só números (ex.: "5511999999999").
  MEU_WHATSAPP: "5511930003532",
  // Se ela errar na 1ª tentativa, a 2ª tentativa dela sempre ganha.
  GARANTIR_VITORIA_NA_2A: true
};

let tentativas = 0;
let busy = false;

function renderAsk(chosen) {
  const ask = $("ask");
  ask.hidden = false;
  $("again").hidden = true;
  ask.innerHTML = `
    <p class="q">Tô merecendo seu número, princesa?</p>
    <form id="askForm" novalidate>
      <input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" aria-label="Seu número">
      <button class="again" type="button" id="send">Enviar 🖤</button>
      <button class="ghost" type="button" id="notNow">Agora não</button>
      <div class="note" id="note"></div>
    </form>`;

  $("notNow").onclick = () => {
    ask.innerHTML = `<p class="q">OOOOOOOOOOOOOOOLOKO PARÇA</p>`;
    $("again").hidden = false;
  };

  const enviar = () => {
    const note = $("note");
    const digits = $("tel").value.replace(/\D/g, "");
    if (digits.length < 8) {
      note.textContent = digits.length === 0 ? "Digita seu número aí, princesa 🖤" : "Faltou número aí, confere com o DDD 🖤";
      return;
    }
    // o número digitado não é enviado pra lugar nenhum
    let html = `<p class="q">Perdão, mas eu não recebo seu número pelo site, ia dar muito trabalho e eu tava com sono</p>`;
    if (CONFIG.MEU_WHATSAPP) {
      const txt = encodeURIComponent("Oi Luan, aqui é a Maria");
      html += `<a class="wpp" href="https://wa.me/${CONFIG.MEU_WHATSAPP}?text=${txt}" target="_blank" rel="noopener">Me chama no WhatsApp</a>`;
    }
    ask.innerHTML = html;
  };

  // funciona por clique, por Enter e por envio do formulário (a prévia do chat pode bloquear o submit)
  $("send").onclick = enviar;
  $("tel").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); enviar(); } };
  $("askForm").onsubmit = (e) => { e.preventDefault(); enviar(); };
}

async function startRace(chosen) {
  if (busy) return;
  busy = true;
  tentativas++;
  let order = shuffle(TEAMS);              // ordem final da corrida
  if (CONFIG.GARANTIR_VITORIA_NA_2A && tentativas >= 2) {
    order = [chosen, ...shuffle(TEAMS.filter(t => t.id !== chosen.id))];
  }
  show("race");

  // semáforo
  const lights = $("lights");
  lights.innerHTML = "";
  for (let i = 0; i < 5; i++) { const l = document.createElement("div"); l.className = "light"; lights.appendChild(l); }

  // pista (uma faixa por equipe)
  const track = $("track");
  track.innerHTML = "";
  const lanes = {};
  TEAMS.forEach(t => {
    const lane = document.createElement("div");
    lane.className = "lane" + (t.id === chosen.id ? " mine" : "");
    lane.style.setProperty("--c", t.color);
    lane.innerHTML = `<div class="car">${carSVG(t)}</div>`;
    track.appendChild(lane);
    lanes[t.id] = lane.querySelector(".car");
  });

  $("status").textContent = "Preparar...";
  await wait(500);
  const ls = lights.querySelectorAll(".light");
  for (const l of ls) { l.classList.add("on"); await wait(650); }
  await wait(500 + Math.random() * 900);
  ls.forEach(l => l.classList.remove("on"));
  $("status").textContent = "Largou!";

  // corrida: quem termina antes tem menor duração
  const laneW = track.querySelector(".lane").clientWidth - 90 - 10;
  order.forEach((t, i) => {
    const el = lanes[t.id];
    el.classList.add("racing");
    el.style.transition = `transform ${3200 + i * 450}ms cubic-bezier(.35,.1,.5,1)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transform = `translateX(${laneW}px)`; }));
  });
  await wait(3200 + 4 * 450 + 500);

  showResult(chosen, order);
  busy = false;
}

function showResult(chosen, order) {
  const pos = order.findIndex(t => t.id === chosen.id) + 1;
  const won = pos === 1;
  const top = $("resultTop");
  $("result").classList.toggle("win", won);

  $("ask").hidden = true;
  $("ask").innerHTML = "";
  $("again").hidden = false;
  $("wpp").hidden = true;

  if (won) {
    top.innerHTML = `<div class="big">Parabéns lindinha 🖤</div>
      <p class="msg">A ${chosen.name} venceu e você acertou.</p>`;
    renderAsk(chosen);
  } else {
    top.innerHTML = `<div class="big">Você ficou em ${pos}º lugar</div>
      <p class="msg">Quase, Maria! Talvez na próxima você consiga seu prêmio.</p>`;
    if (CONFIG.MEU_WHATSAPP) {
      const txt = encodeURIComponent("Oi Luan, aqui é a Maria");
      $("wpp").href = `https://wa.me/${CONFIG.MEU_WHATSAPP}?text=${txt}`;
      $("wpp").hidden = false;
    }
  }

  $("grid").innerHTML = order.map((t, i) => `
    <li class="${t.id === chosen.id ? "mine" : ""}" style="--c:${t.color}">
      <span class="pos">${i + 1}º</span><span>${t.name}</span>
      ${t.id === chosen.id ? '<span class="you">sua escolha</span>' : ""}
    </li>`).join("");

  show("result");
  if (won) confetti();
}

$("again").onclick = () => show("pick");
$("start").onclick = () => show("pick");

// confete simples
function confetti() {
  const cv = $("confetti"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);
  const colors = ["#fff", "#e8002d", "#ff8000", "#27f4d2", "#3671c6"];
  const bits = Array.from({ length: 120 }, () => ({
    x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.6,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
    vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2,
    r: Math.random() * 6, vr: -0.2 + Math.random() * 0.4,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
  let frames = 0;
  (function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    bits.forEach(b => {
      b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
    });
    if (++frames < 260) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}
</script>
</body>
</html>
